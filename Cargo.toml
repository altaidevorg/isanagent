[package]
name = "agent-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
thiserror = "1.0"
log = "0.4"
dyn-clone = "1.0"
downcast-rs = "1.2.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
duckduckgo = "0.2.0"
scraper = "0.25.0"
urlencoding = "2.1.3"
rusqlite = { version = "0.38.0", features = ["bundled"] }
chrono = "0.4.44"
cron = "0.15.0"
serde_yaml = "0.9.34"
which = "6.0.1"
regex = "1.10.6"
shellexpand = "3.1.2"
uuid = { version = "1.21.0", features = ["v4"] }
toml = "1.0.3"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.32"
crossterm = "0.29.0"
colored = "3.1.1"
clap = { version = "4.5.60", features = ["derive"] }
axum = "0.8.8"
tokio-stream = "0.1.18"
dashmap = "6.1.0"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-native-tls"] }
imap = "2.4.1"
native-tls = "0.2.11"

[profile.dev]
debug = false
