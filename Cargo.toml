[package]
name = "isanagent"
version = "0.11.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/altaidevorg/isanagent"
# `russh` (SSH client) requires Rust 1.85+.
rust-version = "1.85"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
thiserror = "1.0"
log = "0.4"
dyn-clone = "1.0"
downcast-rs = "1.2.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.25.0"
urlencoding = "2.1.3"
rusqlite = { version = "0.38.0", features = ["bundled"] }
chrono = "0.4.44"
cron = "0.15.0"
serde_yaml = "0.9.34"
which = "6.0.1"
regex = "1.10.6"
globset = "0.4.15"
walkdir = "2.5.0"
ignore = "0.4"
include_dir = "0.7"
diffy = "0.4.2"
shellexpand = "3.1.2"
uuid = { version = "1.21.0", features = ["v4"] }
toml = "1.0.3"
toml_edit = "0.22"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.32"
# Align with ratatui's crossterm backend (avoids duplicate crossterm versions).
crossterm = "0.28"
colored = "3.1.1"
clap = { version = "4.5.60", features = ["derive"] }
axum = "0.8.8"
tokio-stream = "0.1.18"
dashmap = "6.1.0"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-native-tls"] }
# 3.x alpha tracks imap-proto 0.16+ (2.4.1 pinned 0.10.2, which triggers a rustc future-incompat warning).
imap = "3.0.0-alpha.15"
native-tls = "0.2.11"
moka = { version = "0.12.10", features = ["sync"] }
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"
base64 = "0.22.1"
async-stream = "0.3"
tokio-util = "0.7.18"
ratatui = "0.29"
syntect = { version = "5.2", default-features = false, features = ["default-themes", "default-syntaxes", "regex-fancy"] }
pulldown-cmark = "0.12"
unicode-width = "0.2"
arboard = { version = "3.4", default-features = false }
russh = { version = "0.60", default-features = false, features = ["flate2", "ring", "rsa"] }
htmd = "0.5.4"
pdf_oxide = "0.3.37"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
debug = false

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
tempfile = "3"
