restrict_to_workspace = true

# Root-level limits (must stay above [terminal] so TOML does not nest them under [terminal]).
max_iterations = 999
max_tool_output_chars = 20000
max_web_tool_output_chars = 50000

# Local stdin/stdout chat. Set enabled = false for API-only or headless runs (requires another channel).
# While a reply is in flight, further lines are queued (FIFO per chat). Use /cancel or /stop to abort
# the current turn and discard queued prompts (see /help in the TUI).
[terminal]
enabled = true

# LLM provider. `provider_name` selects a built-in entry from the registry (gemini, openai,
# deepseek, openrouter) so the chat-completions URL stays in code. Set `provider_name =
# "openai_compatible"` to point at any other OpenAI-compatible endpoint and supply `base_url`
# explicitly. `base_url` is also accepted as an optional override for known names (e.g. a proxy
# or self-hosted relay).
[provider]
provider_name = "gemini"
model_name = "gemini-3.1-pro-preview-customtools"
api_key_env = "GEMINI_API_KEY"

[slack]
enabled = false
mode = "webhook"
bot_token = "<changethis>"
signing_secret = "<changethis>"
webhook_port = 8090
webhook_path = "/slack/events"
reply_in_thread = true
reaction_emoji = "eyes"

[email]
enabled = false
imap_host = "imap.agentmail.to"
imap_port = 993
imap_username = "<changethis>"
imap_password = "<changethis>"
smtp_host = "smtp.agentmail.to"
smtp_port = 465
email_address = "<changethis>"

[api]
enabled = false
port = 8080
serve_ui = false
# bind_address = "127.0.0.1" # defaults to 127.0.0.1 when serve_ui = true, else 0.0.0.0

[multi_tenant_edge]
activity_heartbeat_enabled = false
cron_scheduling_enabled = false

# Optional: route web_search / web_fetch through Jina (s.jina.ai / r.jina.ai) when DuckDuckGo or
# direct fetch fails on your network. See https://jina.ai/reader
[jina]
enabled = false
# api_key = "jina_..."  # optional; higher rate limits (Authorization: Bearer)

[memory]
enabled = true
short_term_threshold_turns = 20
short_term_threshold_tokens = 100000
short_term_threshold_mins = 15
long_term_interval_mins = 360
long_term_threshold_summaries = 5
max_recent_summaries = 5

# Registers the `git_worktree` tool (list / add / remove). Paths stay inside the sandbox unless you
# set allow_path_outside_sandbox = true. See docs/harness-implementation-plan.md Phase 4.
[harness.git_worktree]
enabled = true

[harness.subagents]
enabled = true
# cancel_children_on_parent_cancel = false  # default true: explicit cancel (/cancel, BusMessage::Cancel) also stops sub-tasks
# allowed_tools = ["read_file", "glob_files", "search_text", "edit_file"]  # omit = all tools except nested spawn/plan

# Shell policy for `exec` safety. mode applies to interactive sessions; unattended_default applies
# when inbound metadata indicates autonomous/headless execution.
[harness.shell_policy]
mode = "ask"                # ask | deny | allow
unattended_default = "allow" # ask | deny | allow
# interactive_requires_approval_for = ["rm -rf", "git reset --hard"]

# ML policy overlay (embedded in the isanagent binary when enabled). Reference copy: workspace/ML_ENGINEER_OVERLAY.md (onboard). Optional rules merge: workspace/ML_POLICY.md
[harness.ml_engineer]
enabled = true
# subagent_research_overlay = false  # default true when enabled: extra research instructions for sub-agents only
# forbid_final_without_tools = true   # default false: require at least one tool call before ending a reasoning step (also overridable via inbound metadata isanagent_autonomous_forbid_final_without_tools)

# Execution: docs/execution-user-guide.md
[harness.execution]
enabled = true
default_provider = "colab_mcp"
allowed_providers = ["local", "jupyter", "colab_mcp"]
local_python_mode = "repl"
local_python_runtime = "uv_managed"
uv_binary = "uv"
uv_python = "3.11"
uv_requirements = ["afterimage>=0.15.0"]
# Synchronous execution_run / colab_mcp_tool_call calls that exceed this many seconds are
# transparently auto-promoted to a background job; the tool returns a `job_id` envelope you can
# poll with execution_job_status / execution_job_result. Set to 0 to disable, or any value
# between 5 and max_wall_secs. Default: 120.
# auto_promote_after_secs = 120

# When true (default), terminal background jobs enqueue a synthetic inbound so the agent can
# fetch results without waiting for the user. Set false for strict API control.
# wake_on_job_terminal = true

[harness.execution.jupyter]
base_url = "http://127.0.0.1:8888"
token = "<changethis>"
kernel_name = "python3"

# Uncomment when default_provider = "ssh" (key or SSH_PASSWORD in env).
# [harness.execution.ssh]
# host = "my.server.example"
# port = 22
# user = "ubuntu"
# identity_file = "~/.ssh/id_ed25519"
# remote_workdir = "/tmp/isanagent-exec"
# remote_python = "python3"
# accept_unknown_host_keys = true

# Uncomment to override Colab MCP defaults (browser + uv).
# [harness.execution.colab_mcp]
# command = "uvx"
# args = ["git+https://github.com/googlecolab/colab-mcp"]
# startup_timeout_secs = 30
# connect_tool_name = "open_colab_browser_connection"
# execute_tool_name = "execute_python"
# execute_code_arg_keys = ["code", "source"]
# extra_mcp_tool_call_enabled = true
# extra_mcp_tool_allowlist = ["*"]
