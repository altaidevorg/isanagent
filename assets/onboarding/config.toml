restrict_to_workspace = true

# Root-level limits (must stay above [terminal] so TOML does not nest them under [terminal]).
max_iterations = 999
max_tool_output_chars = 20000
max_web_tool_output_chars = 50000

# Local stdin/stdout chat. Set enabled = false for API-only or headless runs (requires another channel).
# While a reply is in flight, further lines are queued (FIFO per chat). Use /cancel or /stop to abort
# the current turn and discard queued prompts (see /help in the TUI).
[terminal]
enabled = true

# LLM providers. At startup, isanagent picks the first provider with a valid API key.
# Use `/model` in the TUI to switch between them at runtime.
#
# Family format: list all models under one provider block. The map key is used as provider_name.
# API key resolution: $<PROVIDER>_API_KEY env var first, then inline `api_key` as fallback.
#
[providers.gemini]
models = ["gemini-2.5-flash", "gemini-2.5-pro", "gemini-3.1-pro", "gemini-3.1-flash-lite"]
api_key = "<changethis>"

[providers.openai]
models = ["gpt-5.5", "gpt-5.5-instant", "gpt-5.4-mini", "gpt-5.4-nano", "o3", "o4-mini"]
api_key = "<changethis>"

[providers.anthropic]
models = ["claude-opus-4-7", "claude-opus-4-6", "claude-sonnet-4-6", "claude-haiku-4-5-20251001"]
api_key = "<changethis>"

[providers.deepseek]
models = ["deepseek-v4-pro", "deepseek-v4-flash"]
api_key = "<changethis>"

# [providers.openrouter]
# models = ["anthropic/claude-opus-4-7", "openai/gpt-5.5", "google/gemini-3.1-pro"]
# # Uses $OPENROUTER_API_KEY
#
# Custom endpoint (legacy per-model format):
# [providers.my-proxy]
# provider_name = "openai_compatible"
# model_name = "my-model"
# base_url = "https://my-proxy.example/v1/chat/completions"
# api_key = "sk-..."

[slack]
enabled = false
mode = "webhook"
bot_token = "<changethis>"
signing_secret = "<changethis>"
webhook_port = 8090
webhook_path = "/slack/events"
reply_in_thread = true
reaction_emoji = "eyes"

[email]
enabled = false
imap_host = "imap.agentmail.to"
imap_port = 993
imap_username = "<changethis>"
imap_password = "<changethis>"
smtp_host = "smtp.agentmail.to"
smtp_port = 465
email_address = "<changethis>"

[api]
enabled = false
port = 8080
serve_ui = false
# bind_address = "127.0.0.1" # defaults to 127.0.0.1 when serve_ui = true, else 0.0.0.0

[multi_tenant_edge]
activity_heartbeat_enabled = false
cron_scheduling_enabled = false

# Optional: route web_search / web_fetch through Jina (s.jina.ai / r.jina.ai) when DuckDuckGo or
# direct fetch fails on your network. See https://jina.ai/reader
[jina]
enabled = false
# api_key = "jina_..."  # optional; higher rate limits (Authorization: Bearer)

[memory]
enabled = true
short_term_threshold_turns = 20
short_term_threshold_tokens = 100000
short_term_threshold_mins = 15
long_term_interval_mins = 360
long_term_threshold_summaries = 5
max_recent_summaries = 5

# Registers the `git_worktree` tool (list / add / remove). Paths stay inside the sandbox unless you
# set allow_path_outside_sandbox = true. See docs/harness-implementation-plan.md Phase 4.
[harness.git_worktree]
enabled = true

[harness.subagents]
enabled = true
# cancel_children_on_parent_cancel = false  # default true: explicit cancel (/cancel, BusMessage::Cancel) also stops sub-tasks
# allowed_tools = ["read_file", "glob_files", "search_text", "edit_file"]  # omit = all tools except nested_spawn/plan
# wake_on_completion = true    # default true: auto-notify parent when a subagent finishes
# task_history_retention = 200 # default 200: max completed tasks retained in SQLite per parent chat

# Named agents (Phase 5b): specialized sub-agents with per-agent system prompts, tool sets,
# and optional model/temperature overrides. When no agents are defined, three built-in
# defaults are auto-registered: researcher, coder, evaluator.
#
# [agents.researcher]
# description = "Research topics, find papers, and gather context from web and files"
# allowed_tools = ["web_search", "web_fetch", "arxiv_search", "arxiv_fetch", "read_file", "search_text"]
# temperature = 0.1
#
# [agents.coder]
# description = "Implement code changes, write tests, refactor, and fix bugs"
# # allowed_tools omitted = inherit harness allowlist
# temperature = 0.2
#
# [agents.evaluator]
# description = "Review code, find bugs, assess quality, and audit changes"
# allowed_tools = ["read_file", "search_text", "glob_files", "list_dir", "web_search"]
# temperature = 0.0
# hidden = false

# Shell policy for `exec` safety. mode applies to interactive sessions; unattended_default applies
# when inbound metadata indicates autonomous/headless execution.
[harness.shell_policy]
mode = "ask"                # ask | deny | allow
unattended_default = "allow" # ask | deny | allow
# interactive_requires_approval_for = ["rm -rf", "git reset --hard"]

# ML policy overlay (embedded in the isanagent binary when enabled). Reference copy: workspace/ML_ENGINEER_OVERLAY.md (onboard). Optional rules merge: workspace/ML_POLICY.md
[harness.ml_engineer]
enabled = true
# subagent_research_overlay = false  # default true when enabled: extra research instructions for sub-agents only
# forbid_final_without_tools = true   # default false: require at least one tool call before ending a reasoning step (also overridable via inbound metadata isanagent_autonomous_forbid_final_without_tools)

# Execution: docs/execution-user-guide.md
[harness.execution]
enabled = true
default_provider = "local"
allowed_providers = ["local", "jupyter", "ssh"]
local_python_mode = "repl"
local_python_runtime = "uv_managed"
uv_binary = "uv"
uv_python = "3.11"
uv_requirements = [
    "afterimage>=0.15.0",
    "google-colab-cli @ git+https://github.com/monatis/google-colab-cli",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "pytest>=8.0",
    "numpy>=1.26",
]
# Synchronous execution_run calls that exceed this many seconds are
# transparently auto-promoted to a background job; the tool returns a `job_id` envelope you can
# poll with execution_job_status / execution_job_result. Set to 0 to disable, or any value
# between 5 and max_wall_secs. Default: 120.
# auto_promote_after_secs = 120

# When true (default), terminal background jobs enqueue a synthetic inbound so the agent can
# fetch results without waiting for the user. Set false for strict API control.
# wake_on_job_terminal = true

[harness.background_jobs]
enabled = true
auto_resume = true

[harness.notifications]
enabled = true

[harness.execution.jupyter]
base_url = "http://127.0.0.1:8888"
token = "<changethis>"
kernel_name = "python3"

# Uncomment when default_provider = "ssh" (key or SSH_PASSWORD in env).
# [harness.execution.ssh]
# host = "my.server.example"
# port = 22
# user = "ubuntu"
# identity_file = "~/.ssh/id_ed25519"
# remote_workdir = "/tmp/isanagent-exec"
# remote_python = "python3"
# accept_unknown_host_keys = true

# MaxEvolve kernel porting (Triton→Pallas). See docs/kernel-porting-user-guide.md
[harness.kernel_porting]
enabled = true
default_project_root = "kernels/projects"
map_elites_schema = ".agents/kernel-porting/map_elites.schema.json"
max_archive_entries = 500
mutation_batch_size = 4

[harness.autotrainess]
enabled = true
default_project_root = "train/projects"
max_log_entries = 500

# MaxEvolve named agents (defining [agents.*] replaces built-in researcher/coder/evaluator defaults)
[agents.researcher]
description = "Research topics, find papers, and gather context from web and files"
allowed_tools = ["web_search", "web_fetch", "arxiv_search", "arxiv_fetch", "read_file", "search_text", "glob_files", "list_dir"]
temperature = 0.1

[agents.coder]
description = "Implement code changes, write tests, refactor, and fix bugs"
temperature = 0.2

[agents.evaluator]
description = "Review code, find bugs, assess quality, and audit changes"
allowed_tools = ["read_file", "search_text", "glob_files", "list_dir", "web_search", "web_fetch"]
temperature = 0.0

